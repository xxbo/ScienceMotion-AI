name: Video Engine CI

concurrency:
  group: video-engine-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-render-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify delegated cgroup controls and a bounded disk volume
        id: resource-probe
        run: bash scripts/fixtures/probe-render-resources-ci.sh

      - name: Upload render worker capability evidence
        if: ${{ !cancelled() && (steps.resource-probe.outcome == 'success' || steps.resource-probe.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-resource-capability
          path: out/render-resource-capability.json
          if-no-files-found: warn

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Verify render job CPU and memory limits
        id: render-resources
        run: bash scripts/fixtures/with-render-cgroup-ci.sh scripts/render-worker-resource-acceptance.ts

      - name: Upload render job resource evidence
        if: ${{ !cancelled() && (steps.render-resources.outcome == 'success' || steps.render-resources.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-worker-resource-evidence
          path: out/render-worker-resources/
          if-no-files-found: error

      - name: Verify render job temporary disk limits
        id: render-temporary
        run: bash scripts/fixtures/accept-render-temporary-ci.sh

      - name: Upload render job temporary disk evidence
        if: ${{ !cancelled() && (steps.render-temporary.outcome == 'success' || steps.render-temporary.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-worker-temporary-evidence
          path: out/render-worker-temporary/
          if-no-files-found: error

      - name: Verify combined render quotas and parallel recovery
        id: render-combined
        run: bash scripts/fixtures/accept-render-combined-ci.sh

      - name: Upload combined render quota evidence
        if: ${{ !cancelled() && (steps.render-combined.outcome == 'success' || steps.render-combined.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-worker-combined-evidence
          path: out/render-worker-combined/
          if-no-files-found: error

  render-performance-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Measure paired render performance and verify results
        id: render-performance
        run: npm run bench:render

      - name: Upload render performance baseline
        if: ${{ !cancelled() && (steps.render-performance.outcome == 'success' || steps.render-performance.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-performance-baseline
          path: out/render-performance/
          if-no-files-found: error

  validate-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Validate renderer-neutral episode package
        run: npm run validate:episode

      - name: Validate canonical project graph
        run: npm run validate:project

      - name: Run platform unit tests
        run: npm test

      - name: Verify 300-manifest catalogue scale and compatibility
        run: npm run accept:catalogue-scale

      - name: Inspect snapshots and repair animation without video encoding
        run: npm run inspect:snapshot-smoke

      - name: Validate project patch schema
        run: npm run validate:project-patch

      - name: Validate agent tool manifests
        run: npm run validate:tool-manifests

      - name: Validate plugin manifests
        run: npm run validate:plugin-manifests

      - name: Render independent SVG storyboard
        run: npm run render:storyboard

      - name: Install system dependencies
        run: |
          # The runner's regional EC2 mirror stalled on the font and FFmpeg packages.
          sudo sed -i -E 's@mirror\+file:/+etc/apt/apt-mirrors\.txt|http://[^[:space:]]+\.ec2\.archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Languages=none)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y fonts-noto-cjk ffmpeg python3-venv

      - name: Set up Mandarin TTS environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-voice.txt

      - name: Validate published 30-second capability sample
        run: python3 scripts/validate-showcase.py

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Measure production browser layout and repair text without image encoding
        run: npm run inspect:layout-smoke

      - name: Verify two-topic public creation, repair, export and restore
        id: creative-loop
        run: npm run accept:creative-loop

      - name: Upload creative-loop evidence and before/after/restored videos
        if: ${{ !cancelled() && (steps.creative-loop.outcome == 'success' || steps.creative-loop.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: creative-loop-evidence
          path: out/creative-loop/
          if-no-files-found: error

      - name: Verify recorded AI trial and deterministic stdio replay
        # Replay is a regression of the retained interaction, not a new model trial.
        run: npm run accept:ai-trial
        id: ai-trial

      - name: Upload historical AI trial replay evidence
        if: ${{ !cancelled() && (steps.ai-trial.outcome == 'success' || steps.ai-trial.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-trial-replay-evidence
          path: out/ai-trial/
          if-no-files-found: error

      - name: Verify isolated render worker replay, cancellation and recovery
        run: npm run accept:render-worker
        id: render-worker

      - name: Upload isolated render worker evidence
        if: ${{ !cancelled() && (steps.render-worker.outcome == 'success' || steps.render-worker.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-worker-evidence
          path: out/ai-trial-worker/
          if-no-files-found: error

      - name: Render generic Project Graph video
        run: npm run render:project

      - name: Validate Project Graph video
        run: npm run validate:project-render

      - name: Render through Creative Host snapshot tools
        run: npm run render:host-smoke

      - name: Validate Creative Host render Artifacts
        run: npm run validate:host-render

      - name: Verify real PNG/MP4 render jobs, retention release and restart
        run: npm run render:job-smoke

      - name: Verify protocol-1.1 worker cancellation and interrupted-host recovery
        id: render-jobs
        run: npm run accept:render-jobs

      - name: Upload background job CLI lifecycle evidence
        if: ${{ !cancelled() && (steps.render-jobs.outcome == 'success' || steps.render-jobs.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-job-cli-evidence
          path: out/render-job-cli/
          if-no-files-found: error

      - name: Verify concurrent worker scheduling and bounded waiting jobs
        id: render-scheduler
        run: npm run accept:render-scheduler

      - name: Upload render scheduler evidence
        if: ${{ !cancelled() && (steps.render-scheduler.outcome == 'success' || steps.render-scheduler.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-scheduler-evidence
          path: out/render-job-scheduler/
          if-no-files-found: error

      - name: Verify concurrent editing and maintenance with real render workers
        id: render-maintenance
        run: npm run accept:render-maintenance

      - name: Upload render maintenance evidence
        if: ${{ !cancelled() && (steps.render-maintenance.outcome == 'success' || steps.render-maintenance.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-maintenance-evidence
          path: out/render-job-maintenance/
          if-no-files-found: error

      - name: Verify chart rendering and targeted pixel changes
        run: npm run render:chart-smoke

      - name: Render demo video
        run: npm run render

      - name: Validate MP4 metadata and audio
        run: npm run validate:video

      - name: Upload rendered video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sciencemotion-demo
          path: |
            out/science-motion-demo.mp4
            out/cpu-cache-storyboard.svg
            out/project-graph-demo.mp4
            out/project-graph-host-preview.png
            out/project-graph-host-video.mp4
            out/job-host-preview.png
            out/job-host-video.mp4
            out/job-host-evidence.json
            out/charts-before.png
            out/charts-after.png
            out/charts-video.mp4
            out/chart-render-evidence.json
            out/snapshot-inspection-evidence.json
            out/layout-inspection-evidence.json
            out/layout-before.png
            out/layout-after.png
            out/catalogue-scale-evidence.json
          if-no-files-found: error
