name: Video Engine CI

concurrency:
  group: video-engine-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Validate renderer-neutral episode package
        run: npm run validate:episode

      - name: Render independent SVG storyboard
        run: npm run render:storyboard

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg python3-venv

      - name: Set up Mandarin TTS environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-voice.txt

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render demo video
        run: npm run render

      - name: Validate MP4 metadata and audio
        run: npm run validate:video

      - name: Upload rendered video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sciencemotion-demo
          path: |
            out/science-motion-demo.mp4
            out/cpu-cache-storyboard.svg
          if-no-files-found: error
