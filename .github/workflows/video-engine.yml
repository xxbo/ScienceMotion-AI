name: Video Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render demo video
        run: npm run render

      - name: Upload rendered video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sciencemotion-demo
          path: out/science-motion-demo.mp4
          if-no-files-found: error
