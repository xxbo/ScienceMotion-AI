name: Video Engine CI

concurrency:
  group: video-engine-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-render-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify delegated cgroup controls and a bounded disk volume
        id: resource-probe
        run: bash scripts/fixtures/probe-render-resources-ci.sh

      - name: Upload render worker capability evidence
        if: ${{ !cancelled() && (steps.resource-probe.outcome == 'success' || steps.resource-probe.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-resource-capability
          path: out/render-resource-capability.json
          if-no-files-found: warn

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Verify render job CPU and memory limits
        id: render-resources
        run: bash scripts/fixtures/with-render-cgroup-ci.sh scripts/render-worker-resource-acceptance.ts

      - name: Upload render job resource evidence
        if: ${{ !cancelled() && (steps.render-resources.outcome == 'success' || steps.render-resources.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-worker-resource-evidence
          path: out/render-worker-resources/
          if-no-files-found: error

      - name: Verify render job temporary disk limits
        id: render-temporary
        run: bash scripts/fixtures/accept-render-temporary-ci.sh

      - name: Upload render job temporary disk evidence
        if: ${{ !cancelled() && (steps.render-temporary.outcome == 'success' || steps.render-temporary.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-worker-temporary-evidence
          path: out/render-worker-temporary/
          if-no-files-found: error

      - name: Verify combined render quotas and parallel recovery
        id: render-combined
        run: bash scripts/fixtures/accept-render-combined-ci.sh

      - name: Upload combined render quota evidence
        if: ${{ !cancelled() && (steps.render-combined.outcome == 'success' || steps.render-combined.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-worker-combined-evidence
          path: out/render-worker-combined/
          if-no-files-found: error

  render-performance-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Measure paired render performance and verify results
        id: render-performance
        run: npm run bench:render

      - name: Upload render performance baseline
        if: ${{ !cancelled() && (steps.render-performance.outcome == 'success' || steps.render-performance.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-performance-baseline
          path: out/render-performance/
          if-no-files-found: error

      - name: Compare disposable workers with a prepared bundle
        id: render-bundle-reuse
        run: npm run bench:render -- --compare bundle

      - name: Verify prepared bundle isolation and invalidation
        run: npx tsx scripts/fixtures/render-bundle-reuse-acceptance.ts

      - name: Upload render bundle reuse evidence
        if: ${{ !cancelled() && (steps.render-bundle-reuse.outcome == 'success' || steps.render-bundle-reuse.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-bundle-reuse
          path: out/render-bundle-reuse/
          if-no-files-found: error

      - name: Compare both render engines on the shared workload
        id: render-engine-comparison
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npm run bench:p1-5-d

      - name: Upload paired engine comparison evidence
        if: ${{ !cancelled() && (steps.render-engine-comparison.outcome == 'success' || steps.render-engine-comparison.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-engine-comparison
          path: out/render-engine-comparison/
          if-no-files-found: error

  validate-and-render:
    runs-on: ubuntu-24.04
    # The full acceptance suite can exceed 20 minutes when system package downloads are slow.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Validate renderer-neutral episode package
        run: npm run validate:episode

      - name: Validate canonical project graph
        run: npm run validate:project

      - name: Run platform unit tests
        run: npm test

      - name: Verify bounded planning through a saved and reopened draft
        id: planning-run
        run: npm run accept:p1-4-b

      - name: Upload planning run acceptance evidence
        if: ${{ !cancelled() && (steps.planning-run.outcome == 'success' || steps.planning-run.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: creative-run-evidence
          path: out/planning-run/
          if-no-files-found: error

      - name: Verify 300-manifest catalogue scale and compatibility
        run: npm run accept:catalogue-scale

      - name: Inspect snapshots and repair animation without video encoding
        run: npm run inspect:snapshot-smoke

      - name: Validate project patch schema
        run: npm run validate:project-patch

      - name: Validate agent tool manifests
        run: npm run validate:tool-manifests

      - name: Validate plugin manifests
        run: npm run validate:plugin-manifests

      - name: Render independent SVG storyboard
        run: npm run render:storyboard

      - name: Install system dependencies
        run: |
          # The runner's regional EC2 mirror stalled on the font and FFmpeg packages.
          sudo sed -i -E 's@mirror\+file:/+etc/apt/apt-mirrors\.txt|http://[^[:space:]]+\.ec2\.archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Languages=none)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y fonts-noto-cjk ffmpeg python3-venv

      - name: Set up Mandarin TTS environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-voice.txt

      - name: Validate published 30-second capability sample
        run: python3 scripts/validate-showcase.py

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Measure production browser layout and repair text without image encoding
        run: npm run inspect:layout-smoke

      - name: Verify two-topic public creation, repair, export and restore
        id: creative-loop
        run: npm run accept:creative-loop

      - name: Upload creative-loop evidence and before/after/restored videos
        if: ${{ !cancelled() && (steps.creative-loop.outcome == 'success' || steps.creative-loop.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: creative-loop-evidence
          path: out/creative-loop/
          if-no-files-found: error

      - name: Verify PNG import and snapshot rendering across host reopen
        id: png-assets
        run: npm run accept:png-assets

      - name: Upload PNG asset acceptance evidence
        if: ${{ !cancelled() && (steps.png-assets.outcome == 'success' || steps.png-assets.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: png-asset-evidence
          path: out/png-assets/
          if-no-files-found: error

      - name: Verify timeline cuts and frame ranges in previews and MP4s
        id: timeline
        run: npm run accept:timeline

      - name: Upload timeline acceptance evidence
        if: ${{ !cancelled() && (steps.timeline.outcome == 'success' || steps.timeline.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: timeline-evidence
          path: out/timeline/
          if-no-files-found: error

      - name: Verify targeted 2D graphics edits, export and snapshot restore
        id: graphics-edit
        run: npm run accept:graphics-edit

      - name: Upload graphics edit acceptance evidence
        if: ${{ !cancelled() && (steps.graphics-edit.outcome == 'success' || steps.graphics-edit.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: graphics-edit-evidence
          path: out/graphics-edit/
          if-no-files-found: error

      - name: Verify keyframe edits, crossfade boundaries and snapshot export
        id: animation
        run: npm run accept:animation

      - name: Upload animation acceptance evidence
        if: ${{ !cancelled() && (steps.animation.outcome == 'success' || steps.animation.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: animation-evidence
          path: out/animation/
          if-no-files-found: error

      - name: Verify narration timing and burned-in caption boundaries
        id: narration
        run: npm run accept:narration

      - name: Upload narration and caption acceptance evidence
        if: ${{ !cancelled() && (steps.narration.outcome == 'success' || steps.narration.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: narration-evidence
          path: out/narration/
          if-no-files-found: error

      - name: Verify integrated short creation, inspection, repair and recovery
        id: integrated-creative
        run: npm run accept:p1-3

      - name: Upload integrated creative acceptance evidence
        if: ${{ !cancelled() && (steps.integrated-creative.outcome == 'success' || steps.integrated-creative.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: integrated-creative-evidence
          path: out/integrated-creative/
          if-no-files-found: error

      - name: Verify inspection-driven repair and retained fallback
        id: creative-repair
        run: npm run accept:p1-4-c

      - name: Upload creative repair acceptance evidence
        if: ${{ !cancelled() && (steps.creative-repair.outcome == 'success' || steps.creative-repair.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: creative-repair-evidence
          path: out/creative-repair/
          if-no-files-found: error

      - name: Verify approved previews, export and restored media
        id: creative-delivery
        run: npm run accept:p1-4-d

      - name: Upload creative delivery acceptance evidence
        if: ${{ !cancelled() && (steps.creative-delivery.outcome == 'success' || steps.creative-delivery.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: creative-delivery-evidence
          path: out/creative-delivery/
          if-no-files-found: error

      - name: Verify two-topic planning, repair, delivery and recovery
        id: creative-acceptance
        run: npm run accept:p1-4-e

      - name: Upload end-to-end creative acceptance evidence
        if: ${{ !cancelled() && (steps.creative-acceptance.outcome == 'success' || steps.creative-acceptance.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: creative-acceptance-evidence
          path: out/p1-4-e/
          if-no-files-found: error

      - name: Verify cross-plugin composition and checkpoint recovery
        id: cross-plugin-composition
        run: npm run accept:p1-5-b

      - name: Upload cross-plugin composition evidence
        if: ${{ !cancelled() && (steps.cross-plugin-composition.outcome == 'success' || steps.cross-plugin-composition.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-plugin-composition-evidence
          path: out/cross-plugin-composition/
          if-no-files-found: error

      - name: Verify the SVG and FFmpeg snapshot adapter
        id: svg-ffmpeg-renderer
        run: npm run accept:p1-5-c

      - name: Upload SVG and FFmpeg renderer evidence
        if: ${{ !cancelled() && (steps.svg-ffmpeg-renderer.outcome == 'success' || steps.svg-ffmpeg-renderer.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: svg-ffmpeg-renderer-evidence
          path: out/svg-ffmpeg-renderer/
          if-no-files-found: error

      - name: Verify shared delivery and recovery across engine switches
        id: engine-delivery
        run: npm run accept:p1-5-d

      - name: Upload shared engine delivery evidence
        if: ${{ !cancelled() && (steps.engine-delivery.outcome == 'success' || steps.engine-delivery.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-delivery-evidence
          path: out/engine-delivery/
          if-no-files-found: error

      - name: Verify the pinned pendulum motion reference
        id: pendulum-reference
        run: npm run accept:p2-1-a

      - name: Upload pendulum reference evidence
        if: ${{ !cancelled() && (steps.pendulum-reference.outcome == 'success' || steps.pendulum-reference.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: pendulum-reference-evidence
          path: out/pendulum-reference/
          if-no-files-found: error

      - name: Verify reusable path following on the pendulum
        id: pendulum-path-following
        run: npm run accept:p2-1-b

      - name: Upload pendulum path following evidence
        if: ${{ !cancelled() && (steps.pendulum-path-following.outcome == 'success' || steps.pendulum-path-following.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: pendulum-path-following-evidence
          path: out/pendulum-path-following/
          if-no-files-found: error

      - name: Verify scoped edits of motion path and timing
        id: pendulum-motion-edit
        run: npm run accept:p2-1-c

      - name: Upload scoped motion edit evidence
        if: ${{ !cancelled() && (steps.pendulum-motion-edit.outcome == 'success' || steps.pendulum-motion-edit.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: pendulum-motion-edit-evidence
          path: out/pendulum-motion-edit/
          if-no-files-found: error

      - name: Verify tool-authored pendulum delivery and restore
        id: pendulum-delivery
        run: npm run accept:p2-1-d

      - name: Upload pendulum delivery and restore evidence
        if: ${{ !cancelled() && (steps.pendulum-delivery.outcome == 'success' || steps.pendulum-delivery.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: pendulum-delivery-evidence
          path: out/pendulum-delivery/
          if-no-files-found: error

      - name: Verify the static Three.js input contract
        id: three-static-contract
        run: npm run accept:p2-2-a

      - name: Upload static Three.js contract evidence
        if: ${{ !cancelled() && (steps.three-static-contract.outcome == 'success' || steps.three-static-contract.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: three-static-contract-evidence
          path: out/three-static-contract/
          if-no-files-found: error

      - name: Render and verify the static Three.js shot
        id: three-static-shot
        run: npm run accept:p2-2-b

      - name: Upload static Three.js shot evidence
        if: ${{ !cancelled() && (steps.three-static-shot.outcome == 'success' || steps.three-static-shot.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: three-static-shot-evidence
          path: out/three-static-shot/
          if-no-files-found: error

      - name: Render and verify Three.js camera motion
        id: three-camera-motion
        run: npm run accept:p2-2-c

      - name: Upload Three.js camera motion evidence
        if: ${{ !cancelled() && (steps.three-camera-motion.outcome == 'success' || steps.three-camera-motion.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: three-camera-motion-evidence
          path: out/three-camera-motion/
          if-no-files-found: error

      - name: Verify Three.js Host delivery and restore
        id: three-host-delivery
        run: npm run accept:p2-2-d

      - name: Upload Three.js Host delivery evidence
        if: ${{ !cancelled() && (steps.three-host-delivery.outcome == 'success' || steps.three-host-delivery.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: three-host-delivery-evidence
          path: out/three-host-delivery/
          if-no-files-found: error

      - name: Verify recorded AI trial and deterministic stdio replay
        # Replay is a regression of the retained interaction, not a new model trial.
        run: npm run accept:ai-trial
        id: ai-trial

      - name: Upload historical AI trial replay evidence
        if: ${{ !cancelled() && (steps.ai-trial.outcome == 'success' || steps.ai-trial.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-trial-replay-evidence
          path: out/ai-trial/
          if-no-files-found: error

      - name: Verify isolated render worker replay, cancellation and recovery
        run: npm run accept:render-worker
        id: render-worker

      - name: Upload isolated render worker evidence
        if: ${{ !cancelled() && (steps.render-worker.outcome == 'success' || steps.render-worker.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-worker-evidence
          path: out/ai-trial-worker/
          if-no-files-found: error

      - name: Render generic Project Graph video
        run: npm run render:project

      - name: Validate Project Graph video
        run: npm run validate:project-render

      - name: Render through Creative Host snapshot tools
        run: npm run render:host-smoke

      - name: Validate Creative Host render Artifacts
        run: npm run validate:host-render

      - name: Verify real PNG/MP4 render jobs, retention release and restart
        run: npm run render:job-smoke

      - name: Verify protocol-1.1 worker cancellation and interrupted-host recovery
        id: render-jobs
        run: npm run accept:render-jobs

      - name: Upload background job CLI lifecycle evidence
        if: ${{ !cancelled() && (steps.render-jobs.outcome == 'success' || steps.render-jobs.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-job-cli-evidence
          path: out/render-job-cli/
          if-no-files-found: error

      - name: Verify concurrent worker scheduling and bounded waiting jobs
        id: render-scheduler
        run: npm run accept:render-scheduler

      - name: Upload render scheduler evidence
        if: ${{ !cancelled() && (steps.render-scheduler.outcome == 'success' || steps.render-scheduler.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-scheduler-evidence
          path: out/render-job-scheduler/
          if-no-files-found: error

      - name: Verify concurrent editing and maintenance with real render workers
        id: render-maintenance
        run: npm run accept:render-maintenance

      - name: Upload render maintenance evidence
        if: ${{ !cancelled() && (steps.render-maintenance.outcome == 'success' || steps.render-maintenance.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-maintenance-evidence
          path: out/render-job-maintenance/
          if-no-files-found: error

      - name: Verify chart rendering and targeted pixel changes
        run: npm run render:chart-smoke

      - name: Render demo video
        run: npm run render

      - name: Validate MP4 metadata and audio
        run: npm run validate:video

      - name: Upload rendered video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sciencemotion-demo
          path: |
            out/science-motion-demo.mp4
            out/cpu-cache-storyboard.svg
            out/project-graph-demo.mp4
            out/project-graph-host-preview.png
            out/project-graph-host-video.mp4
            out/job-host-preview.png
            out/job-host-video.mp4
            out/job-host-evidence.json
            out/charts-before.png
            out/charts-after.png
            out/charts-video.mp4
            out/chart-render-evidence.json
            out/snapshot-inspection-evidence.json
            out/layout-inspection-evidence.json
            out/layout-before.png
            out/layout-after.png
            out/catalogue-scale-evidence.json
          if-no-files-found: error
